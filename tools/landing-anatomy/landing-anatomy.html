}

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"></head><body class="iso" data-theme="dark"><script>(()=>{const h=location.hash.slice(1);const t=h==="light"||h==="dark"?h:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.body.dataset.theme=t;})()</script><main class="iso-page"><style>/* 앱 디자인 토큰(frontend/src/app/styles/tokens.styles.ts)의 브랜드 색 */
.iso {
  --lb-blue: #6b9ae6;
  --lb-blue-ink: #3f6fc4;
  --lb-yellow: #f5b91e;
  --lb-paint-edge: color-mix(in srgb, var(--lb-blue) 80%, #ffffff);
  --lb-yellow-edge: color-mix(in srgb, var(--lb-yellow) 85%, #ffffff);
  --anatomy-mono: "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, sans-serif;
}
.iso[data-theme="light"] {
  --lb-paint-edge: var(--lb-blue-ink);
  --lb-yellow-edge: color-mix(in srgb, var(--lb-yellow) 70%, #000000);
}
body.iso { font-family: "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, sans-serif; }
.iso-plate-corner { font-family: inherit; font-size: 11.5px; letter-spacing: 0.01em; }
.iso-plate-corner[data-corner="title"], .iso-plate-corner[data-corner="hint"] { text-transform: none; letter-spacing: 0.02em; }
.iso-face-text { letter-spacing: 0.08em; font-weight: 600; }
.iso-swatch[data-mark="blue"] path { stroke: var(--lb-blue); stroke-width: 2.4; }
.iso-swatch[data-mark="yellow"] path { stroke: var(--lb-yellow); stroke-width: 2.4; }

/* 동네 칸: 시간대 띠마다 파랑의 짙기가 다르다 */
.lb-tile { transition: transform 420ms var(--anatomy-ease); }
.lb-tile .iso-top, .lb-tile .iso-shade { transition: fill 420ms var(--anatomy-ease); }
.lb-tile .lb-tile-body > .iso-edge { transition: stroke 420ms var(--anatomy-ease); }
.lb-tile[data-band] { cursor: pointer; }
.lb-tile[data-band="1"] { --lb-mix: 92%; }
.lb-tile[data-band="2"] { --lb-mix: 72%; }
.lb-tile[data-band="3"] { --lb-mix: 54%; }
.lb-tile[data-band="4"] { --lb-mix: 40%; }
.lb-tile[data-band="5"] { --lb-mix: 28%; }
.lb-tile[data-band="6"] { --lb-mix: 18%; }
.lb-tile[data-band] .lb-tile-body > .iso-top { fill: color-mix(in srgb, var(--lb-blue) var(--lb-mix), var(--anatomy-top)); }
.lb-tile[data-band] .lb-tile-body > .iso-shade[data-shade="0"] { fill: color-mix(in srgb, var(--lb-blue-ink) var(--lb-mix), var(--anatomy-shade-0)); }
.lb-tile[data-band] .lb-tile-body > .iso-shade[data-shade="1"] { fill: color-mix(in srgb, var(--lb-blue-ink) var(--lb-mix), var(--anatomy-shade-1)); }
.lb-tile[data-band] .lb-tile-body > .iso-shade[data-shade="2"] { fill: color-mix(in srgb, var(--lb-blue-ink) var(--lb-mix), var(--anatomy-shade-2)); }
.lb-tile[data-band] .lb-tile-body > .iso-shade[data-shade="3"] { fill: color-mix(in srgb, var(--lb-blue-ink) var(--lb-mix), var(--anatomy-shade-3)); }
.lb-tile[data-band] .lb-tile-body > .iso-edge { stroke: var(--lb-paint-edge); }
.lb-tile[data-band] .lb-inset { stroke: color-mix(in srgb, var(--lb-paint-edge) 45%, transparent); }

/* 본 방 핀과 카드: 브랜드 노랑 */
.lb-pin { opacity: 0; transform: translateY(-6px); transition: opacity 360ms var(--anatomy-ease), transform 520ms var(--anatomy-ease); }
.lb-tile[data-rec] .lb-pin { opacity: 1; transform: none; }
.lb-pin-head > .iso-top { fill: var(--lb-yellow); }
.lb-pin-head > .iso-shade { fill: color-mix(in srgb, var(--lb-yellow) 70%, #7a5200); }
.lb-pin-head > .iso-edge { stroke: var(--lb-yellow-edge); }
.lb-card { opacity: 0; transform: translateY(-10px); transition: opacity 360ms var(--anatomy-ease), transform 560ms var(--anatomy-ease); }
.lb-card[data-on] { opacity: 1; transform: none; }
.lb-card-body > .iso-top { fill: var(--lb-yellow); }
.lb-card-body > .iso-shade { fill: color-mix(in srgb, var(--lb-yellow) calc(var(--lb-card-mix, 16%) + 8%), var(--anatomy-face)); }
.lb-card-body > .iso-fill { fill: color-mix(in srgb, var(--lb-yellow) var(--lb-card-mix, 16%), var(--anatomy-face)); }
.iso:not([data-theme="light"]) { --lb-card-mix: 34%; }
.lb-card-body > .iso-edge { stroke: var(--lb-yellow-edge); }
.lb-card-band { stroke: var(--lb-yellow-edge) !important; }
.lb-checks circle { opacity: 0.18; transition: opacity 300ms; }
.lb-checks circle[data-state="ok"] { opacity: 0.9; fill: var(--lb-blue-ink); }
.lb-checks circle[data-state="warn"] { opacity: 1; fill: var(--lb-yellow-edge); }

.lb-hit { cursor: pointer; transition: transform 420ms var(--anatomy-ease); }
.lb-stage { cursor: ew-resize; touch-action: pan-y; outline: none; }
.lb-stage:focus-visible { box-shadow: 0 0 0 1px var(--lb-blue); }
.lb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lb-sixty { stroke: var(--lb-blue) !important; stroke-width: 1.1; }

/* 그림 아래 비교표 */
.lb-compare { margin-top: 8px; color: var(--anatomy-text); }
.lb-compare h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--anatomy-strong); display: flex; gap: 8px; align-items: center; }
.lb-compare h2::before { content: ""; width: 3px; height: 13px; background: var(--lb-yellow); }
.lb-compare h2 span { color: var(--anatomy-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.lb-table { display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr)); font-size: 12.5px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--anatomy-faint); }
.lb-table > * { padding: 6px 8px; border-bottom: 1px solid var(--anatomy-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-table .h { color: var(--anatomy-muted); }
.lb-table .n { color: var(--anatomy-strong); font-weight: 600; }
.lb-table .e { color: var(--anatomy-faint); }
@media (prefers-reduced-motion: reduce) {
  .lb-tile, .lb-tile *, .lb-pin, .lb-card, .lb-hit, .lb-checks circle { transition: none !important; }
}
@media (max-width: 560px) {
  .iso-plate-corner { font-size: 10.5px; }
  .iso-plate-corner[data-corner="hint"] { max-width: 46%; white-space: normal; line-height: 1.3; word-break: keep-all; }
  .lb-table { grid-template-columns: 48px repeat(5, minmax(0, 1fr)); font-size: 11.5px; }
  .lb-table > * { padding: 5px 4px; }

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;
// 동네 판을 움직이는 코드. build.mjs가 __DATA__와 __BAND__를 채워 페이지에 넣는다.
const DATA = {"P":{"origin":[276.3192951032956,175.2764063878412],"scale":1.127768278226649,"azimuth":56,"elevation":34},"lift":[0,-3.55],"times":[[62,62,62],[22,22,22],[22,22,22],[56,56,56],[62,62,62],[68,68,68],[74,74,74],[22,22,22],[16,16,16],[10,10,10],[16,16,16],[22,22,22],[28,28,28],[34,34,34],[22,22,22],[10,10,10],[0,0,0],[16,16,16],[22,22,22],[28,28,28],[34,34,34],[56,31,31],[16,16,16],[16,16,16],[55,31,31],[62,38,38],[68,45,45],[74,52,52],[62,31,31],[22,22,22],[22,22,22],[55,31,31],[62,38,38],[69,45,45],[76,52,52],[68,68,68],[28,28,28],[28,28,28],[68,68,68],[102,78,78],[109,84,60],[116,84,60]],"rent":[45,53,61,57,46,42,38,51,59,67,63,52,48,44,57,65,73,69,58,54,50,51,59,67,63,52,48,44,45,53,61,57,46,42,38,39,47,55,51,40,36,36],"names":["A1","B1","C1","D1","E1","F1","G1","A2","B2","C2","D2","E2","F2","G2","A3","B3","C3","D3","E3","F3","G3","A4","B4","C4","D4","E4","F4","G4","A5","B5","C5","D5","E5","F5","G5","A6","B6","C6","D6","E6","F6","G6"],"home":16,"records":[34,33],"minutes":{"min":10,"max":90,"step":5,"start":60},"rents":[45,50,55,60,65,70,null],"max":5,"maxTransfers":2,"dial":{"x":88,"y":-46,"knob":17},"sw":[-12,0,12],"rentPos":[-96,-80,-64,-48,-32,-16,0]};
const bandOf = (minutes) => Math.min(6, Math.max(1, Math.ceil(minutes / 15)));
const P = DATA.P;
const stage = document.querySelector(".lb-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const pointer = svg.querySelector('[data-part="pointer"]');
const thumb = svg.querySelector('[data-part="thumb"]');
const slider = svg.querySelector('[data-part="slider"]');
const tiles = [...svg.querySelectorAll("[data-tile]")];
const cards = [...svg.querySelectorAll("[data-card]")];
const table = document.querySelector("[data-table]");
const count = document.querySelector("[data-count]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const { min, max, step } = DATA.minutes;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const px = (t) => t.replace(/translate\(([-\d.]+) ([-\d.]+)\)/, "translate($1px,$2px)");
const LIFT = `translate(${DATA.lift[0]}px,${DATA.lift[1]}px)`;

const angleOf = (m) => (-135 + (m / 90) * 270) * (Math.PI / 180);
const pointerAt = (m) => {
  const a = angleOf(m);
  const { x, y, knob } = DATA.dial;
  return lineOnTop([x + Math.sin(a) * 2, y - Math.cos(a) * 2], [x + Math.sin(a) * (knob - 5), y - Math.cos(a) * (knob - 5)], 10, P);
};

const state = { minutes: DATA.minutes.start, transfers: 1, rent: DATA.rents.length - 1, records: DATA.records.slice() };
let shown = state.minutes; // 다이얼이 실제로 가리키는 값(부드럽게 따라간다)
let painted = new Set();

const rentText = (i) => (DATA.rents[i] == null ? "월세 상한 없음" : `월세 ${DATA.rents[i]}만원 이하`);
const passes = (i, m) => {
  const t = DATA.times[i][state.transfers];
  const cap = DATA.rents[state.rent];
  return t <= m && (cap == null || DATA.rent[i] <= cap);
};

// 칸마다 체크리스트 진행: 괜찮음, 주의, 미확인 세 칸. 칸 번호로 정해진 예시 값이다.
const checksOf = (i) => [0, 1, 2].map((j) => ["ok", "warn", "ok", "none", "ok"][(i * 3 + j * 2) % 5]);

function paint(m) {
  const next = new Set();
  tiles.forEach((el) => {
    const i = Number(el.dataset.tile);
    if (passes(i, m)) {
      next.add(i);
      const band = String(bandOf(DATA.times[i][state.transfers]));
      if (el.dataset.band !== band) el.dataset.band = band;
      if (!el.style.transform) el.style.transform = LIFT;
    } else {
      if (el.dataset.band) delete el.dataset.band;
      if (el.style.transform) el.style.transform = "";
    }
  });
  painted = next;
}

function drawRecords() {
  // 기록이 칠해진 칸 밖으로 밀려나도 카드는 그대로 둔다(본 방은 남는다).
  tiles.forEach((el) => {
    const on = state.records.includes(Number(el.dataset.tile));
    if (on !== el.hasAttribute("data-rec")) on ? el.setAttribute("data-rec", "") : el.removeAttribute("data-rec");
  });
  cards.forEach((card, slot) => {
    const i = state.records[slot];
    if (i == null) {
      card.removeAttribute("data-on");
      return;
    }
    card.setAttribute("data-on", "");
    const checks = checksOf(i);
    card.querySelectorAll("[data-check]").forEach((dot, j) => (dot.dataset.state = checks[j]));
  });
  count.textContent = `${state.records.length}/${DATA.max}`;
  const cells = ['<span class="h">동네</span>'];
  const rows = [
    ["통근", (i) => `${DATA.times[i][state.transfers]}분`],
    ["환승", (i) => `${transfersUsed(i)}회`],
    ["월세", (i) => `${DATA.rent[i]}만원`],
    ["체크", (i) => `${checksOf(i).filter((c) => c !== "none").length}/3`],
  ];
  for (let s = 0; s < DATA.max; s++) cells.push(state.records[s] != null ? `<span class="n">${DATA.names[state.records[s]]}</span>` : `<span class="e">빈 칸</span>`);
  for (const [label, fn] of rows) {
    cells.push(`<span class="h">${label}</span>`);
    for (let s = 0; s < DATA.max; s++) cells.push(state.records[s] != null ? `<span>${fn(state.records[s])}</span>` : `<span class="e">-</span>`);
  }
  table.innerHTML = cells.join("");
}
// 허용한 환승 안에서 가장 빠른 길이 실제로 몇 번 갈아타는지
const transfersUsed = (i) => {
  const row = DATA.times[i];
  for (let k = 0; k <= state.transfers; k++) if (row[k] === row[state.transfers]) return k;
  return state.transfers;
};

function text() {
  return `${Math.round(state.minutes)}분, 환승 ${state.transfers}회까지, ${rentText(state.rent)} → 동네 ${painted.size}곳, 비교 ${state.records.length}/${DATA.max}`;
}
function report(extra) {
  const t = extra ?? text();
  if (readout.textContent !== t) readout.textContent = t;
  stage.setAttribute("aria-valuenow", String(Math.round(state.minutes)));
  stage.setAttribute("aria-valuetext", t);
}
function drawControls() {
  thumb.style.transform = px(translateAlong(P, [DATA.sw[state.transfers], 0, 0]));
  slider.style.transform = px(translateAlong(P, [DATA.rentPos[state.rent], 0, 0]));
}

// ---------- 움직임: 다이얼은 지수 따라가기, 그 사이 칸은 시간 순서대로 칠해진다 ----------
let frame = 0, last = 0, visible = false, touring = !still.matches, clock = 0, idleTimer = 0;
const TOUR = [30, 45, 60, 75, 90, 60];
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) {
    clock += dt;
    state.minutes = TOUR[Math.floor(clock / 2.8) % TOUR.length];
  }
  shown = still.matches ? state.minutes : shown + (state.minutes - shown) * (1 - Math.exp(-dt / 0.35));
  if (Math.abs(state.minutes - shown) < 0.05) shown = state.minutes;
  pointer.setAttribute("d", pointerAt(shown));
  paint(shown);
  report();
  const settled = !touring && shown === state.minutes;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
function hold() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    clock = 0;
    run();
  }, 6000);
}
function setMinutes(m) {
  hold();
  state.minutes = clamp(Math.round(m / step) * step, min, max);
  run();
}
function cycleTransfers() {
  hold();
  state.transfers = (state.transfers + 1) % (DATA.maxTransfers + 1);
  drawControls();
  paint(shown);
  drawRecords();
  report();
  announce(`환승 ${state.transfers}회까지`);
  run();
}
function cycleRent() {
  hold();
  state.rent = (state.rent + 1) % DATA.rents.length;
  drawControls();
  paint(shown);
  report();
  announce(rentText(state.rent));
  run();
}
function toggleRecord(i) {
  hold();
  const at = state.records.indexOf(i);
  if (at >= 0) state.records.splice(at, 1);
  else if (state.records.length >= DATA.max) {
    report(`비교는 최대 ${DATA.max}개까지예요`);
    return;
  } else state.records.push(i);
  drawRecords();
  report();
  announce(at >= 0 ? `${DATA.names[i]} 기록을 뺐어요` : `${DATA.names[i]}를 기록했어요`);
}
const announce = (t) => (status.textContent = t);

// ---------- 입력 ----------
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, from: state.minutes, moved: false, target: e.target };
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const box = svg.getBoundingClientRect();
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 4) drag.moved = true;
  if (drag.moved) setMinutes(drag.from + (dx / box.width) * 160);
});
const end = () => {
  if (drag && !drag.moved) {
    const hit = drag.target.closest?.("[data-tile], [data-act]");
    if (hit?.dataset.act === "transfer") cycleTransfers();
    else if (hit?.dataset.act === "rent") cycleRent();
    else if (hit?.dataset.tile != null && painted.has(Number(hit.dataset.tile))) toggleRecord(Number(hit.dataset.tile));
  }
  drag = null;
};
stage.addEventListener("pointerup", end);
stage.addEventListener("pointercancel", () => (drag = null));
stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") setMinutes(state.minutes + step);
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") setMinutes(state.minutes - step);
  else if (e.key === "Home") setMinutes(min);
  else if (e.key === "End") setMinutes(max);
  else if (e.key === "t" || e.key === "T") cycleTransfers();
  else if (e.key === "r" || e.key === "R") cycleRent();
  else if (e.key === " " || e.key === "Enter") {
    const next = [...painted].filter((i) => !state.records.includes(i)).sort((a, b) => DATA.times[a][state.transfers] - DATA.times[b][state.transfers])[0];
    if (next != null) toggleRecord(next);
  } else if (e.key === "Escape") {
    hold();
    state.records = [];
    drawRecords();
    report();
  } else return;
  e.preventDefault();
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener?.("change", () => {
  if (still.matches) touring = false;
});

drawControls();
pointer.setAttribute("d", pointerAt(shown));
paint(shown);
drawRecords();
report();
</script></body></html>
