<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자취선배 랜딩 모션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 영상 전용 장면: 행정동 추천 지도 → 지도가 누우며 비행 → 매물 사진 속 3D 방 → 2D 비교·보고서 → 로고. */
:root {
  --floor: #f9fbfb; --floor-edge: #f2f3f6;
  --ink: #212124; --soft: #5f6368; --muted: #868b94;
  --card: #ffffff; --chip: #f1f2f4; --line: #eaebed;
  --yellow: #f5b91e; --yellow-soft: #fdf1cf; --yellow-mid: #fbe1a0;
  --blue: #6b9ae6; --blue-soft: #e4edfb; --good: #3f6fc4;
  --caution-soft: #fde6e6; --caution: #d14d4d;
  --ground: #f3f4f0; --block: #e7eae3; --block-2: #e0e4dc; --road: #ffffff; --road-edge: #e3e6e0;
  --park: #d8e8cf; --water: #d2e3f1; --label: #a2a8a1; --shadow: #1a2133;
  --dong: #eceee9; --dong-line: #ffffff;
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-display: 'Gothic A1', 'IBM Plex Sans KR', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--floor); }
#vp { position: relative; width: 1440px; height: 1152px; overflow: hidden; font-family: var(--font); color: var(--ink);
  background: radial-gradient(ellipse 75% 75% at 50% 50%, var(--floor) 55%, var(--floor-edge) 100%);
  perspective: 1880px; perspective-origin: 50% 50%; }
#cam { position: absolute; left: 720px; top: 576px; width: 0; height: 0; transform-style: preserve-3d; }
#region { position: absolute; left: -3000px; top: -3400px; width: 8400px; height: 9800px; }
#map { position: absolute; left: 0; top: -1600px; width: 2400px; height: 5600px; border-radius: 24px; overflow: hidden; }
#world { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.piece { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
.shadow { position: absolute; left: 0; top: 0; background: var(--shadow); transform-origin: 50% 100%; }

.pin { display: flex; flex-direction: column; align-items: center; }
.pin .bub { display: flex; align-items: baseline; gap: 6px; padding: 9px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1.5px var(--line); white-space: nowrap; }
.pin .bub b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pin .bub span { font-size: 14px; color: var(--muted); font-weight: 600; }
.pin .tip { width: 14px; height: 14px; background: var(--card); transform: rotate(45deg); margin-top: -8px; box-shadow: 1.5px 1.5px 0 0 var(--line); }
.pin.sel .bub, .pin.sel .tip { background: var(--yellow); box-shadow: none; }
.pin.sel .bub span { color: var(--ink); }
.memo { width: 300px; padding: 16px 18px; border-radius: 18px; background: var(--card); display: flex; flex-direction: column; gap: 7px; }
.memo .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--blue-soft); color: var(--good); }
.memo p { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 600; }
.memo .who { font-size: 13px; color: var(--muted); }
.memo.y { background: var(--yellow-soft); }
.listing { width: 220px; border-radius: 16px; overflow: hidden; background: var(--card); }
.listing .ph { height: 120px; }
.listing .body { padding: 11px 14px 13px; display: flex; flex-direction: column; gap: 3px; }
.listing b { font-size: 16px; }
.listing span { font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
.ph1 { background: linear-gradient(180deg, #bcd6f2 0 42%, #d9d2c5 42% 72%, #b99a76 72%); }
.ph2 { background: linear-gradient(160deg, #d9d2c5 0 55%, #b99a76 55%); }
.chip { padding: 12px 20px; border-radius: 999px; font-size: 20px; font-weight: 700; white-space: nowrap; }
.chip.good { background: var(--blue-soft); color: var(--good); }
.chip.warn { background: var(--caution-soft); color: var(--caution); }
.chip.plain { background: var(--card); color: var(--ink); }
.tile { width: 56px; height: 56px; border-radius: 16px; background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; }

/* 매물 카드: 기본 크기 1440 폭. 사진 영역(1440×1152)이 화면을 꽉 채우도록 설계했다. */
.hcard { width: 1440px; height: 1482px; border-radius: 60px; background: var(--card); overflow: hidden; box-shadow: 0 50px 120px rgba(26,33,51,.16); }
.hcard .photo { position: relative; width: 1440px; height: 1152px; overflow: hidden; }
.hcard .body { height: 330px; padding: 52px 72px; display: flex; flex-direction: column; gap: 18px; }
.hcard .body b { font-size: 92px; letter-spacing: -0.02em; line-height: 1.1; }
.hcard .body span { font-size: 72px; color: var(--soft); font-variant-numeric: tabular-nums; }
#target { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }

/* 방 */
.rv { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 46%; overflow: hidden; background: #e2dbcf; }
.rcam { position: absolute; left: 720px; top: 576px; width: 0; height: 0; transform-style: preserve-3d; }
.face { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.back { width: 1200px; height: 800px; background: var(--wall-back); }
.floorf { width: 1200px; height: 1400px; background: repeating-linear-gradient(90deg, var(--wood-1) 0 118px, var(--wood-2) 118px 120px), var(--wood-1); }
.ceil { width: 1200px; height: 1400px; background: #f6f3ee; }
.lwall, .rwall { width: 1400px; height: 800px; background: var(--wall-side); }
.win { position: absolute; left: 330px; top: 150px; width: 540px; height: 360px; border-radius: 6px; background: linear-gradient(180deg, #a9cdf2, #d8e9f8); box-shadow: inset 0 0 0 16px #fff; }
.win::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 14px; background: #fff; transform: translateX(-50%); }
.win::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 16px; height: 70px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.4)); }
.sill { position: absolute; left: 310px; top: 510px; width: 580px; height: 22px; background: #fbfaf7; border-radius: 4px; }
.door { position: absolute; left: 520px; top: 130px; width: 330px; height: 670px; background: #cdbfa9; border-radius: 6px 6px 0 0; box-shadow: inset 0 0 0 10px #bfae95; }
.door i { position: absolute; right: 36px; top: 340px; width: 30px; height: 14px; border-radius: 6px; background: #8f7f68; }
.counter { position: absolute; left: 380px; top: 470px; width: 760px; height: 330px; background: #fbfaf8; box-shadow: inset 0 22px 0 #d9d9d6; }
.counter i { position: absolute; left: 240px; top: -70px; width: 18px; height: 80px; border-radius: 9px 9px 0 0; background: #b7bcc2; }
.cabinet { position: absolute; left: 380px; top: 90px; width: 760px; height: 200px; background: #fbfaf8; box-shadow: inset 0 -6px 0 #e4e2dd; }
.stain { position: absolute; left: 70px; top: 60px; width: 260px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(90,96,84,.45), rgba(90,96,84,.18) 60%, transparent); }
.rchip { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rchip .chip { font-size: 40px; padding: 18px 30px; box-shadow: 0 10px 30px rgba(26,33,51,.12); }
.rchip .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 6px rgba(255,255,255,.5); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.finder { position: absolute; inset: 70px; opacity: 0; }
.finder i { position: absolute; width: 70px; height: 70px; border: 0 solid #fff; }
.finder i:nth-child(1) { left: 0; top: 0; border-width: 7px 0 0 7px; }
.finder i:nth-child(2) { right: 0; top: 0; border-width: 7px 7px 0 0; }
.finder i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 7px 7px; }
.finder i:nth-child(4) { right: 0; bottom: 0; border-width: 0 7px 7px 0; }

.panel { position: absolute; right: 44px; top: 70px; width: 420px; padding: 26px; border-radius: 30px; background: var(--card); box-shadow: 0 20px 60px rgba(26,33,51,.18); display: grid; }
.panel > .stage { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 16px; }
.ph-head { display: flex; justify-content: space-between; align-items: baseline; }
.ph-head b { font-size: 28px; letter-spacing: -0.02em; }
.ph-head span { font-size: 16px; color: var(--muted); font-weight: 600; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.thumb { height: 86px; border-radius: 12px; background: var(--chip); position: relative; overflow: hidden; }
.thumb .img { position: absolute; inset: 0; opacity: 0; }
.th1 { background: linear-gradient(180deg, #e2dbcf 0 18%, #a9cdf2 18% 66%, #e2dbcf 66%); }
.th2 { background: linear-gradient(90deg, #e9e3d8 0 30%, #cdbfa9 30% 70%, #e9e3d8 70%); }
.th3 { background: linear-gradient(180deg, #fbfaf8 0 35%, #e9e3d8 35% 55%, #d9d9d6 55% 60%, #fbfaf8 60%); }
.field { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-radius: 14px; background: var(--chip); }
.field span { font-size: 17px; color: var(--muted); font-weight: 600; }
.field b { font-size: 28px; font-variant-numeric: tabular-nums; }
.field b small { font-size: 16px; color: var(--soft); margin-left: 2px; }
.ck { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-radius: 14px; background: var(--chip); font-size: 20px; font-weight: 700; }
.pill { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
.pill.good { background: var(--blue-soft); color: var(--good); }
.pill.warn { background: var(--caution-soft); color: var(--caution); }
.ring { position: relative; width: 52px; height: 52px; }
.ring svg { width: 100%; height: 100%; rotate: -90deg; }
.ring circle { fill: none; stroke-width: 6; }
.ring .tr { stroke: var(--chip); }
.ring .pr { stroke: var(--blue); stroke-linecap: round; stroke-dasharray: 125.7; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.save { height: 60px; border-radius: 16px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 700; }
.save.done { background: var(--blue); }

/* 화면 공간 */
.dof { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.dof.far { backdrop-filter: blur(2.5px); mask-image: linear-gradient(to bottom, #000 0%, transparent 30%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 30%); }
.dof.n1 { backdrop-filter: blur(3px); mask-image: linear-gradient(to bottom, transparent 62%, #000 74%); -webkit-mask-image: linear-gradient(to bottom, transparent 62%, #000 74%); }
.dof.n2 { backdrop-filter: blur(9px); mask-image: linear-gradient(to bottom, transparent 74%, #000 88%); -webkit-mask-image: linear-gradient(to bottom, transparent 74%, #000 88%); }
.dof.n3 { backdrop-filter: blur(20px); mask-image: linear-gradient(to bottom, transparent 86%, #000 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 86%, #000 100%); }
.haze { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(to bottom, var(--floor) 0%, rgba(249,251,251,.55) 9%, rgba(249,251,251,0) 26%); }

#ui { position: absolute; inset: 0; pointer-events: none; }
.c2 { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; }
.rowlbl { position: absolute; left: 40px; font-size: 22px; font-weight: 700; color: var(--soft); opacity: 0; }
.cell { position: absolute; width: 360px; height: 60px; display: grid; place-items: center; border-radius: 14px; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0; }
.cell.warn { color: var(--caution); }
.btn2 { position: absolute; left: 50%; top: 950px; height: 76px; padding: 0 40px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 26px; font-weight: 700; display: grid; place-items: center; opacity: 0; white-space: nowrap; }
.report { position: absolute; left: 50%; top: 0; width: 640px; height: 880px; margin-left: -320px; border-radius: 22px; background: var(--card); box-shadow: 0 40px 120px rgba(26,33,51,.22); padding: 52px 56px; display: flex; flex-direction: column; gap: 24px; opacity: 0; }
.report .kick { font-size: 17px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.report h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: -0.02em; }
.report .sub { font-size: 18px; color: var(--soft); }
.best { padding: 22px 26px; border-radius: 18px; background: var(--yellow-soft); display: flex; flex-direction: column; gap: 8px; }
.best span { font-size: 16px; font-weight: 700; color: var(--soft); }
.best b { font-size: 34px; }
.best em { font-style: normal; font-size: 18px; color: var(--soft); }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar { display: grid; grid-template-columns: 120px 1fr 70px; align-items: center; gap: 14px; font-size: 18px; font-weight: 600; }
.bar .tr { height: 14px; border-radius: 7px; background: var(--chip); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 7px; background: var(--blue); transform-origin: 0 50%; }
.bar .tr i.y { background: var(--yellow); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.rline { height: 14px; border-radius: 7px; background: var(--chip); }
.stamp { position: absolute; right: 50px; bottom: 60px; width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--yellow); color: var(--ink); display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.2; opacity: 0; background: rgba(253,241,207,.6); }
.logo { position: absolute; left: 0; right: 0; top: 400px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.logo .lt { width: 132px; height: 132px; border-radius: 38px; background: var(--yellow); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 64px; opacity: 0; }
.logo .ln { font-family: var(--font-display); font-weight: 800; font-size: 80px; letter-spacing: -0.03em; opacity: 0; }
.logo .tl { font-size: 28px; color: var(--muted); opacity: 0; }
.white { position: absolute; inset: 0; background: var(--floor); opacity: 0; }
</style>
<style>
/* v3 추가: 행정동 격자, 등록 시트, 비교표 */
#region { left: -12000px; top: -9000px; width: 30000px; height: 24000px; }
#map { left: -800px; top: -3800px; width: 7600px; height: 7600px; border-radius: 0; }
.piece, .shadow { transform-origin: 50% 100%; }
.sheet { position: absolute; left: 330px; top: 80px; width: 780px; padding: 34px; border-radius: 36px; background: var(--card); box-shadow: 0 30px 90px rgba(26,33,51,.22); display: flex; flex-direction: column; gap: 18px; }
.sh-head { display: flex; justify-content: space-between; align-items: center; }
.sh-head b { font-size: 34px; letter-spacing: -0.02em; }
.sh-head span { font-size: 18px; color: var(--muted); font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.f { padding: 14px 18px; border-radius: 16px; background: var(--chip); display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.f span { font-size: 16px; color: var(--muted); font-weight: 600; }
.f b { font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.f.on { background: var(--yellow-soft); }
.sec { display: flex; justify-content: space-between; align-items: center; }
.sec b { font-size: 24px; }
.cks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cki { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--chip); }
.cki span { font-size: 17px; font-weight: 700; }
.cki .pill { align-self: flex-start; }
.pill.none { background: var(--card); color: var(--muted); box-shadow: inset 0 0 0 1.5px #c6c6c6; }
.thumbs3 { display: flex; gap: 10px; }
.thumbs3 span { width: 96px; height: 64px; border-radius: 12px; }
.tbl-title { position: absolute; left: 120px; top: 52px; font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -0.02em; opacity: 0; }
.tbl-sub { position: absolute; left: 120px; top: 104px; font-size: 20px; color: var(--soft); opacity: 0; display: none; }
.rowline { position: absolute; left: 120px; width: 1200px; height: 1.5px; background: var(--line); transform-origin: 0 50%; }

.page { position: absolute; top: 96px; width: 580px; padding: 30px; border-radius: 40px; background: var(--card); box-shadow: 0 30px 90px rgba(26,33,51,.22); display: flex; flex-direction: column; gap: 16px; opacity: 0; }
#pg1 { left: 110px; } #pg2 { left: 750px; }
.pg-top { display: flex; justify-content: space-between; align-items: center; min-height: 52px; }
.pg-top > span { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.pg-top > b { font-size: 18px; color: var(--muted); font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; height: 76px; padding: 0 22px; border-radius: 16px; background: var(--chip); }
.row span { font-size: 19px; color: var(--soft); font-weight: 600; }
.row b { font-size: 30px; font-variant-numeric: tabular-nums; }
.row.on { background: var(--card); box-shadow: inset 0 0 0 2.5px var(--yellow); }
.cl { display: flex; flex-direction: column; gap: 8px; }
.cr { display: flex; justify-content: space-between; align-items: center; height: 62px; padding: 0 10px 0 20px; border-radius: 14px; background: var(--chip); }
.cr > span { font-size: 20px; font-weight: 700; }
.opts { display: flex; gap: 6px; }
.o { font-style: normal; font-size: 15px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: var(--card); color: var(--muted); }
.o.good.on { background: var(--blue); color: #fff; }
.o.warn.on { background: var(--caution); color: #fff; }
.o.none.on { background: #9aa0a6; color: #fff; }
.tap { position: absolute; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(33,33,36,.2); box-shadow: 0 0 0 3px rgba(255,255,255,.9); opacity: 0; }
</style>
</head>
<body>
<div id="vp">
  <div id="cam">
    <div id="region"></div>
    <div id="map"></div>
    <div id="world"></div>
    <div id="target"></div>
  </div>
  <div class="dof far"></div><div class="dof n1"></div><div class="dof n2"></div><div class="dof n3"></div>
  <div class="haze"></div>
  <div id="ui"></div>
</div>

<script>
(() => {
  const P = 1880;
  const clamp = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b);
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIO = (t) => { t = clamp(t); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  const eo = (t) => 1 - Math.pow(1 - clamp(t), 3);
  const expo = (t) => { t = clamp(t); return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); };
  const back = (t) => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const pop = (el, t0, t, dur = 0.25, dy = 12) => { const e = eo((t - t0) / dur); el.style.opacity = e; el.style.transform = `translateY(${dy * (1 - e)}px) scale(${lerp(0.9, 1, e)})`; return e; };
  const fmt = (n) => n.toLocaleString('ko-KR');

  /* ---------- 행정동 격자 (5×4) ---------- */
  const GX0 = -12000, GY0 = -9000, CS = 6000, COLS = 5, ROWS = 4;
  const NAMES = [
    ['운중동', '판교동', '금토동', '고등동', '시흥동'],
    ['대장동', '백현동', '삼평동', '이매1동', '야탑1동'],
    ['동원동', '정자1동', '서현1동', '서현2동', '야탑3동'],
    ['구미동', '금곡동', '수내1동', '분당동', '율동'],
  ];
  const KEEP = { '삼평동': '교통', '백현동': '교통', '서현1동': '교통', '이매1동': '매물 기록', '정자1동': '매물 기록' };
  const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
  const pt = (i, j) => {
    const edge = i === 0 || j === 0 || i === COLS || j === ROWS;
    return [GX0 + i * CS + (edge ? 0 : (hash(i, j) - 0.5) * 1800), GY0 + j * CS + (edge ? 0 : (hash(j, i + 9) - 0.5) * 1800)];
  };

    const fade = 1 - ss(8.1, 8.5, t);
    const hdeg = -c.yaw;
    const hr = (hdeg * Math.PI) / 180;
    pieces.forEach((p) => {
      const d = (p.x - c.lx) * Math.sin(hr) - (p.y - c.ly) * Math.cos(hr);
      const k = (1 - ss(350, 1100, d)) * gate;
      const z = lerp(3, p.z, k);
      const a = c.tilt * k;
      let s = p.base;
      if (p.spot) s *= 1 + 0.12 * Math.max(0, Math.sin(clamp((t - p.spot + 0.2) / 0.5) * Math.PI));
      let op = fade * gate;
      if (p.target) {
        s *= 1 + (t > 7.95 && t < 8.3 ? Math.sin(Math.PI * (t - 7.95) / 0.35) * 0.3 : 0);
        p.inner.classList.toggle('sel', t >= 8.0);
        op = gate * (1 - ss(8.4, 8.6, t));
      }
      const x = p.x - p.w / 2, y = p.y - p.h;
      p.el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateZ(${hdeg}deg) rotateX(${-a}deg) scale(${s})`;
      p.el.style.opacity = op;
      const cos = Math.max(Math.cos((a * Math.PI) / 180), 0.2);
      p.sh.style.transform = `translate3d(${x}px, ${y + 4 + 0.36 * z}px, 1px) rotateZ(${hdeg}deg) scale(${s}, ${s * cos})`;
      p.sh.style.filter = `blur(${7 + 0.5 * z}px)`;
      p.sh.style.opacity = 0.26 * op * clamp(z / 30);
    });

    /* 매물 카드 → 사진 속 방 */
    const dT = (TX - c.lx) * Math.sin(hr) - (B - c.ly) * Math.cos(hr);
    const kT = (1 - ss(350, 1100, dT)) * gate;
    const u = easeIO((t - (FEND + 0.35)) / (9.0 - FEND - 0.35));
    const bump = t > 7.95 && t < 8.3 ? Math.sin(Math.PI * (t - 7.95) / 0.35) * 0.1 : 0;
    const ts = lerp(0.2, 1, u) * (1 + bump);
    const ta = lerp(c.tilt * kT, 0, u);
    const tz = lerp(lerp(3, 130, kT), 4, u);
    target.style.transform = `translate3d(${TX - 720}px, ${B - 1482}px, ${tz}px) rotateZ(${hdeg * (1 - u)}deg) rotateX(${-ta}deg) scale(${ts})`;
    target.style.opacity = gate;

    // 방 하나에서 두 페이지: 왼쪽은 매물 정보 입력, 오른쪽은 체크리스트를 하나씩 누른다.
    const dz = lerp(0, 760, easeIO((t - 8.4) / 3.2));
    rcam.style.transform = `translateZ(${dz}px)`;
    const roomOn = ss(9.25, 9.55, t) * (1 - ss(12.95, 13.2, t));
    rv.style.filter = `blur(${4 * roomOn}px)`;
    roomdim.style.opacity = 0.22 * roomOn;
    flash.style.opacity = t >= 9.05 ? Math.max(0, 0.9 - (t - 9.05) / 0.22) : 0;
    [[pg1, 9.25, -1], [pg2, 9.4, 1]].forEach(([pg, t0, dir]) => {
      const e = eo((t - t0) / 0.35), out = ss(12.95, 13.15, t);
      pg.style.opacity = e * (1 - out);
      pg.style.transform = `translate(${dir * 90 * (1 - e)}px, ${50 * out}px)`;
    });
    thumbs.forEach((th, i) => { const e = back((t - 9.5 - i * 0.08) / 0.25); th.style.opacity = clamp(e); th.style.transform = `scale(${lerp(0.4, 1, e)})`; });
    rowEls.forEach((row, i) => {
      const t0 = 9.75 + i * 0.2;
      const b = row.querySelector('b'), v = b.dataset.v;
      const n = Math.round(clamp((t - t0) / 0.16) * v.length);
      b.textContent = n > 0 ? v.slice(0, n) : '';
      row.classList.toggle('on', t >= t0 - 0.02 && t < t0 + 0.24);
    });
    let tx = taps[0].x, ty = taps[0].y, press = 0;
    for (let i = 0; i < taps.length; i++) {
      const tp = taps[i], prev = taps[i - 1] || tp;
      const m = easeIO((t - (tp.t - 0.14)) / 0.12);
      if (t >= tp.t - 0.14) { tx = lerp(prev.x, tp.x, m); ty = lerp(prev.y, tp.y, m); }
      if (t >= tp.t && t < tp.t + 0.12) press = Math.sin(Math.PI * (t - tp.t) / 0.12);
    }
    tap.style.opacity = ss(10.8, 10.95, t) * (1 - ss(12.85, 12.95, t));
    tap.style.transform = `translate(${tx}px, ${ty}px) scale(${1 - 0.25 * press})`;
    taps.slice(0, CHECKS.length).forEach((tp) => tp.el.classList.toggle('on', t >= tp.t));
    const nck = taps.slice(0, CHECKS.length).filter((tp) => t >= tp.t).length;
    rn.textContent = `${nck}/8`;
    ringPr.style.strokeDashoffset = 125.7 * (1 - nck / 8);
    save.style.transform = `scale(${1 - 0.05 * (t > SAVE_T && t < SAVE_T + 0.15 ? Math.sin(Math.PI * (t - SAVE_T) / 0.15) : 0)})`;
    save.classList.toggle('done', t >= SAVE_T + 0.05);
    save.textContent = t >= SAVE_T + 0.05 ? '저장했어요 ✓' : '저장하기';

    const dofOn = ss(3.6, 4.0, t) * (1 - ss(8.1, 8.5, t));
    dofs.forEach((d) => (d.style.opacity = dofOn));
    haze.style.opacity = dofOn;

    /* 2D 비교표 */
    pop(ttl, 13.4, t, 0.3, 14);
    c2.forEach((el, i) => {
      const e = eo((t - 13.4 - i * 0.08) / 0.32);
      el.style.opacity = e;
      el.style.transform = `translate(${COLX[i + 1] + 140 * (1 - e)}px, ${CMP.top}px) scale(${CMP.scale})`;
    });
    tlines.forEach((l, r) => { l.style.transform = `scaleX(${eo((t - 13.7 - r * 0.08) / 0.3)})`; });
    tlabels.forEach((l, r) => pop(l, 13.7 + r * 0.08, t, 0.2, 10));
    tcells.forEach(({ el, r, c: col, best }) => {
      pop(el, 13.75 + r * 0.08 + col * 0.03, t, 0.2, 10);
      el.style.background = best && t >= 14.4 + r * 0.06 ? 'var(--yellow-soft)' : 'transparent';
    });

    /* 로고 */
    fin.style.opacity = ss(15.6, 15.9, t);
    const le = back((t - 15.85) / 0.4);
    lt.style.opacity = clamp(le * 2); lt.style.transform = `scale(${lerp(0.4, 1, le)}) rotate(${lerp(-12, 0, clamp(le))}deg)`;
    pop(ln, 15.98, t, 0.35, 20);
    pop(tl, 16.15, t, 0.35, 14);
  };
  window.__total = 17.2;
  window.__seek(0);

  // 브라우저에서 바로 확인할 때: flyover.html#play 는 실시간 재생, #t=8.5 는 그 시점에 멈춘 화면.
  const view = location.hash;
  if (view === '#play') {
    const start = performance.now();
    const loop = () => { window.__seek(((performance.now() - start) / 1000) % window.__total); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else if (view.startsWith('#t=')) {
    window.__seek(Number(view.slice(3)) || 0);
  }
})();
</script>
</body>
</html>
