<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Maze 웹사이트 테스트 연결: dev·로컬에서는 외부 스니펫을 로드하지 않는다.
      if (window.location.origin === 'https://www.jachwi-sunbae.kr') {
        (function (m, a, z, e) {
          var s, t, u, v;
          try {
            t = m.sessionStorage.getItem('maze-us');
          } catch (err) {}

          if (!t) {
            t = new Date().getTime();
            try {
              m.sessionStorage.setItem('maze-us', t);
            } catch (err) {}
          }

          u =
            document.currentScript ||
            (function () {
              var w = document.getElementsByTagName('script');
              return w[w.length - 1];
            })();
          v = u && u.nonce;

          s = a.createElement('script');
          s.src = z + '?apiKey=' + e;
          s.async = true;
          if (v) s.setAttribute('nonce', v);
          a.getElementsByTagName('head')[0].appendChild(s);
          m.mazeUniversalSnippetApiKey = e;
        })(
          window,
          document,
          'https://snippet.maze.co/maze-universal-loader.js',
          '25d1f829-0857-4a92-a8f0-e8fa7bf184e9',
        );
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 이미지 규칙을 거쳐 해시가 붙은 파일명으로 나가므로, 파비콘을 바꿔도 1년 캐시에 막히지 않는다. -->
    <link rel="icon" type="image/png" href="<%= require('./src/shared/assets/favicon.png') %>" />
    <link rel="apple-touch-icon" href="<%= require('./src/shared/assets/apple-touch-icon.png') %>" />
    <meta
      name="description"
      content="집은 짧게 보지만 놓친 문제는 매일 반복됩니다. 매물의 사진·메모·체크 결과를 기록하고 관리해 돈을 잃지 않는 방을 고르세요."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="자취선배 | 집은 짧게 보지만, 놓친 문제는 매일 반복됩니다" />
    <meta
      property="og:description"
      content="매물의 기록과 관리로 관리비·보증금·수리비처럼 계약 뒤에 알면 늦는 돈을 집을 보는 순간 확인하세요."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="자취선배 | 돈을 잃지 않는 방을 고르세요" />
    <meta
      name="twitter:description"
      content="계약을 성사시키는 쪽이 한편이라면, 자취선배는 계약 후를 살아갈 임차인의 편입니다."
    />
    <title>자취선배</title>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
