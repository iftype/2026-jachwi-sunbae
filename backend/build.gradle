plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jachwisunbae'
version = '2.0.1'
description = 'Jachwi Sunbae MVP2 backend application'

def sourceCommitId = providers.environmentVariable('SOURCE_COMMIT_ID')
		.orElse(providers.environmentVariable('CODEBUILD_RESOLVED_SOURCE_VERSION'))
		.orElse(providers.gradleProperty('sourceCommitId'))
		.orElse('local')

springBoot {
	buildInfo {
		properties {
			excludes = ['time']
			additional = [commit: sourceCommitId]
		}
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
	implementation platform('software.amazon.awssdk:bom:2.41.24')
	implementation 'software.amazon.awssdk:s3'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'acceptance'
	}
}

tasks.register('testAll', Test) {
	group = 'verification'
	description = '인수 테스트를 포함한 모든 테스트를 실행한다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	dependsOn tasks.named('bootJar')
	systemProperty 'rental.import.jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
}

tasks.register('importRentalTransactions', JavaExec) {
	group = 'application'
	description = '소형 주택 월세 CSV를 법정동 코드에 매핑하고 검증 또는 적재한다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jachwisunbae.rental.importer.RentalImportCommand'
}

tasks.register('importTransitNetwork', JavaExec) {
	group = 'application'
	description = '행정동 경계와 GTFS 파일을 목적지 탐색용 노선망으로 적재한다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jachwisunbae.transit.importer.TransitImportCommand'
}
