spring:
  application:
    name: jachwi-sunbae-backend
  profiles:
    default: local
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

auth:
  jwt:
    secret: ${JWT_SECRET:local-demo-jwt-secret-at-least-32-bytes}
    issuer: jachwi-sunbae
    audience: jachwi-sunbae-api
    access-token-seconds: 43200

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

photo:
  storage:
    region: ${PHOTO_STORAGE_REGION:us-east-1}
    bucket: ${PHOTO_STORAGE_BUCKET:jachwi-sunbae-photos}
    key-prefix: ${PHOTO_STORAGE_KEY_PREFIX:}

map:
  provider:
    mode: ${MAP_PROVIDER_MODE:demo}
  nearby:
    provider: ${MAP_NEARBY_PROVIDER:demo}
  juso:
    confirm-key: ${JUSO_CONFIRM_KEY:}
  sgis:
    consumer-key: ${SGIS_CONSUMER_KEY:}
    consumer-secret: ${SGIS_CONSUMER_SECRET:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  connect-timeout-millis: ${MAP_CONNECT_TIMEOUT_MILLIS:2000}
  read-timeout-millis: ${MAP_READ_TIMEOUT_MILLIS:5000}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
