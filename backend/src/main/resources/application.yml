spring:
  application:
    name: jachwi-sunbae-backend
  profiles:
    default: local
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

auth:
  jwt:
    secret: ${JWT_SECRET:local-demo-jwt-secret-at-least-32-bytes}
    issuer: jachwi-sunbae
    audience: jachwi-sunbae-api
    access-token-seconds: 900
  refresh-token:
    validity-days: 365
  oauth:
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:}
    # 탈퇴할 때 철회할 Apple refresh token을 암호화하는 32바이트 키(Base64)
    token-encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY:}
    unlink:
      # 탈퇴 후 제공자 연결 해제 요청을 처리한다.
      enabled: false
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:}
      native-audiences: ${KAKAO_OAUTH_NATIVE_AUDIENCES:}
      admin-key: ${KAKAO_OAUTH_ADMIN_KEY:}
    apple:
      client-id: ${APPLE_OAUTH_CLIENT_ID:}
      client-secret: ${APPLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${APPLE_OAUTH_REDIRECT_URI:}
      native-audiences: ${APPLE_OAUTH_NATIVE_AUDIENCES:}
      team-id: ${APPLE_OAUTH_TEAM_ID:}
      key-id: ${APPLE_OAUTH_KEY_ID:}
      private-key: ${APPLE_OAUTH_PRIVATE_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

photo:
  storage:
    region: ${PHOTO_STORAGE_REGION:us-east-1}
    bucket: ${PHOTO_STORAGE_BUCKET:jachwi-sunbae-photos}
    key-prefix: ${PHOTO_STORAGE_KEY_PREFIX:}

property:
  ai:
    bedrock:
      region: ap-northeast-2
      model-id: global.anthropic.claude-sonnet-5-5

map:
  provider:
    mode: ${MAP_PROVIDER_MODE:demo}
  nearby:
    provider: ${MAP_NEARBY_PROVIDER:demo}
  juso:
    confirm-key: ${JUSO_CONFIRM_KEY:}
  sgis:
    consumer-key: ${SGIS_CONSUMER_KEY:}
    consumer-secret: ${SGIS_CONSUMER_SECRET:}
  naver:
    search:
      client-id: ${NAVER_SEARCH_CLIENT_ID:}
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  connect-timeout-millis: ${MAP_CONNECT_TIMEOUT_MILLIS:2000}
  read-timeout-millis: ${MAP_READ_TIMEOUT_MILLIS:5000}

promotion:
  collection:
    enabled: false
    seven-eleven:
      # 하루 1회 연동 조건이 있어 운영 주체를 정한 환경에서만 켠다.
      enabled: false

delivery-discount:
  notification:
    enabled: true

weather:
  kma:
    api-key: ${KMA_API_KEY:}
  notification:
    enabled: false
    # 운영자 테스트 알림 API의 비밀키. 비어 있으면 API가 항상 거부한다.
    test-push-key: ${WEATHER_TEST_PUSH_KEY:}
  collection:
    enabled: false
  cleanup:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
