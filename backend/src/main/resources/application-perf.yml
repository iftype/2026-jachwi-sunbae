# 부하 테스트 서버 전용. prod와 함께 SPRING_PROFILES_ACTIVE=prod,perf 로 실행한다.
# Actuator를 127.0.0.1:9091 로 분리하므로 이 프로필에서는 /actuator/health, /actuator/info 도 9091에서 응답한다.
management:
  server:
    port: 9091
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
