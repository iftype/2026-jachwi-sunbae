name: jachwi-sunbae-backend

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jachwi_sunbae}
      MYSQL_USER: ${DB_USERNAME:-jachwi_sunbae}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./src/main/resources/db/init/002-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./docker/mysql/init/003-bus-stops-sample.sql:/docker-entrypoint-initdb.d/003-bus-stops-sample.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PHOTO_STORAGE_ACCESS_KEY:-local-photo-access-key}
      MINIO_ROOT_PASSWORD: ${PHOTO_STORAGE_SECRET_KEY:-local-photo-secret-key}
    ports:
      - "127.0.0.1:${PHOTO_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${PHOTO_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      PHOTO_STORAGE_ACCESS_KEY: ${PHOTO_STORAGE_ACCESS_KEY:-local-photo-access-key}
      PHOTO_STORAGE_SECRET_KEY: ${PHOTO_STORAGE_SECRET_KEY:-local-photo-secret-key}
      PHOTO_STORAGE_BUCKET: ${PHOTO_STORAGE_BUCKET:-jachwi-sunbae-photos}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$$PHOTO_STORAGE_ACCESS_KEY" "$$PHOTO_STORAGE_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$PHOTO_STORAGE_BUCKET"

volumes:
  mysql-data:
  minio-data:
