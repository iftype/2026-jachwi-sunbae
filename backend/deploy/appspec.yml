version: 0.0
os: linux

files:
  - source: /
    destination: /opt/jachwi-sunbae

hooks:
  # 직전 배포 리비전의 스크립트가 실행된다. 첫 배포에는 실행되지 않는다.
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 420
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 300
      runas: root
